<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 6 Technologies – Connections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --ink:#1d1d1f; --muted:#6b6b70; --tile:#e7e3d8; --tile-sel:#4a4a52;
  --card:#fff; --btn:#fff; --line:#ddd; --dotlost:#ccc;
  --g0:#f2d65c; --g1:#9fc77a; --g2:#9cc0ea; --g3:#bf9fdc; --herring:#ef7f6c;
}
html[data-theme="dark"]{--bg:#16171b;--ink:#ecebe6;--muted:#a0a0a8;--tile:#2c2d34;--tile-sel:#d9d7cf;--card:#202127;--btn:#202127;--line:#34353c;--dotlost:#44454c;
  --g0:#e3c64a;--g1:#8fb86b;--g2:#87aedb;--g3:#ad8ccc;--herring:#e06f5d}
html[data-theme="dark"] .tile.sel{color:#16171b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
#themeBtn{border:2px solid var(--ink);background:var(--btn);color:var(--ink);border-radius:999px;padding:5px 10px;font:600 15px Inter,sans-serif;cursor:pointer;white-space:nowrap;margin-top:4px}
header h1{font-size:clamp(22px,4vw,32px);margin:4px 0 2px;font-weight:800;letter-spacing:-.5px}
header p{margin:0;color:var(--muted);font-size:15px}
.rounds{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 8px}
.rounds button{border:2px solid var(--ink);color:var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font:600 13px Inter,sans-serif;cursor:pointer}
.rounds button.active{background:var(--ink);color:var(--bg)}
.rounds button.done::after{content:" ✓"}
.round-title{margin:10px 0 2px;font-size:19px;font-weight:800}
.round-sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.info{font-size:14px;margin-bottom:12px;color:var(--muted)}
.info b{color:var(--herring)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{overflow-wrap:anywhere;hyphens:manual;background:var(--tile);border:none;border-radius:8px;min-height:80px;padding:6px;font:700 clamp(11px,1.9vw,15px) Inter,sans-serif;text-transform:uppercase;cursor:pointer;line-height:1.15;color:var(--ink);transition:transform .1s, background .15s}
.tile:hover{transform:translateY(-1px)}
.tile.sel{background:var(--tile-sel);color:#fff}
.tile.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.solved{color:#1d1d1f;border-radius:8px;padding:12px 10px;text-align:center;margin-bottom:8px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.solved h3{margin:0 0 3px;font-size:15px;text-transform:uppercase;font-weight:800}
.solved .words{font-size:14px;font-weight:600}
.solved .why{font-size:13px;margin-top:6px;font-weight:400;opacity:.9}
.herrings{color:#1d1d1f;background:var(--herring);border-radius:8px;padding:12px;margin-bottom:8px}
.herrings h3{margin:0 0 6px;text-align:center;text-transform:uppercase;font-size:15px}
.herrings ul{margin:0;padding-left:18px;font-size:13.5px}
.herrings li{margin:4px 0}
.status{min-height:26px;text-align:center;font-weight:700;margin:12px 0 4px}
.lives{text-align:center;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--tile-sel);margin:0 3px;vertical-align:middle}
.dot.lost{background:var(--dotlost)}
.controls{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.controls button{border:2px solid var(--ink);color:var(--ink);background:var(--btn);border-radius:999px;padding:9px 18px;font:600 14px Inter,sans-serif;cursor:pointer}
.controls button.primary{background:var(--ink);color:var(--bg)}
.controls button:disabled{opacity:.35;cursor:default}
.score{text-align:center;margin-top:14px;font-size:14px;color:var(--muted)}
details{margin-top:36px;background:var(--card);border-radius:10px;padding:12px 16px;border:1px solid var(--line)}
summary{font-weight:700;cursor:pointer}
.key h4{margin:16px 0 6px}
.key table{width:100%;border-collapse:collapse;font-size:13px}
.key td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.key td:first-child{font-weight:700;width:34%}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.howto{font-size:14px;line-height:1.5}
@media (max-width:520px){.tile{min-height:62px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Technologies Connections</h1>
  <button id="themeBtn" aria-label="Toggle light and dark mode"></button>
</header>

<div class="rounds" id="rounds"></div>

<div id="solvedArea"></div>
<div class="grid" id="grid"></div>
<div class="status" id="status"></div>
<div class="lives" id="lives"></div>
<div class="controls">
  <button id="shuffleBtn">Shuffle</button>
  <button id="clearBtn">Deselect</button>
  <button id="submitBtn" class="primary">Submit</button>
  <button id="resetBtn">Restart round</button>
  <button id="nextBtn" style="display:none">Next round →</button>
</div>


</div>

<script>
const ROUNDS = [
{
  title:"Round 1 · Investigating with technology",
  sub:"Practical investigations from the slides",
  groups:[
    {name:"Temperature on reaction rate", words:["Alka-Seltzer","Magnesium ribbon","Hydrochloric acid","Gas syringe"],
     why:"The two reaction-rate pracs: Alka-Seltzer dissolving at different water temperatures, and Mg + HCl, timing how long it takes to collect 20 mL of gas in a syringe."},
    {name:"Volume of gases", words:["Boyle's law","Charles' law","Kelvin scale","Model lung"],
     why:"Boyle: pV = constant at constant temperature. Charles: V ∝ T at constant pressure, with T in kelvin (°C + 273). The model lung shows pressure–volume changes."},
    {name:"Speed on distance travelled", words:["Sphero","Stopwatch","Tape measure","Distance = speed × time"],
     why:"The Sphero robot investigation: set the speed, time the run and measure the distance travelled."},
    {name:"Assessing safety", words:["Safety Data Sheet","Safety goggles","WHS guidelines","Risk assessment"],
     why:"Assess the safety of the technologies chosen, using chemical safety data and Work Health and Safety guidelines."}
  ],
  herrings:[
    {word:"Hydrochloric acid", tempts:"Assessing safety", why:"It's corrosive, so it feels like a safety word, but it's a reactant in the Mg + HCl rate prac. (The SDS is the safety technology.)"},
    {word:"Gas syringe", tempts:"Volume of gases", why:"It measures gas volume, but in this prac it collects the 20 mL of hydrogen used to work out reaction rate."},
    {word:"Kelvin scale", tempts:"Temperature on reaction rate", why:"Temperature is the IV in the rate prac, but kelvin is needed for Charles' law (V ∝ T only works in kelvin)."},
    {word:"Stopwatch", tempts:"Temperature on reaction rate", why:"The rate prac is timed too, but the stopwatch is the timing tool in the Sphero speed–distance investigation."}
  ]
},
{
  title:"Round 2 · Errors, accuracy & devices",
  sub:"Random vs systematic error; analogue vs digital",
  groups:[
    {name:"Systematic error", words:["Zero error","Faulty calibration","Consistent offset","Fix by recalibrating"],
     why:"Every reading is shifted by the same amount in the same direction. This affects accuracy, and repeating trials won't fix it."},
    {name:"Random error", words:["Reaction time","Scatter around the mean","Reduce by repeating","Changing conditions"],
     why:"Unpredictable variation in both directions (stopwatch timing, wind, humidity). Repeat trials and average to reduce its effect."},
    {name:"Analogue technology", words:["Liquid-in-glass thermometer","Clock with hands","Continuous scale","Parallax"],
     why:"A continuously varying value on a scale, read by eye. This brings in parallax and estimating between the markings."},
    {name:"Digital technology", words:["Data logger","Temperature probe","Binary signal","Fixed decimal display"],
     why:"Information is converted into binary (0/1) and shown as discrete values. Record the full reading shown (1.32 s, not 1.3 s)."}
  ],
  herrings:[
    {word:"Parallax", tempts:"Random / systematic error", why:"It's a reading error, but here it identifies analogue devices: you only get parallax when reading a scale by eye."},
    {word:"Reaction time", tempts:"Analogue technology (stopwatches & clocks)", why:"It's about timing, but the point is the human error in starting and stopping, which is random."},
    {word:"Temperature probe", tempts:"Analogue technology (thermometers)", why:"It measures temperature like the glass thermometer, but it's an electronic sensor that gives a digital readout."},
    {word:"Zero error", tempts:"Digital technology (tare/zero button)", why:"Digital balances have a zero button, but a zero error (an instrument not reading zero at the start) is the classic systematic error."}
  ]
},
{
  title:"Round 3 · Technology → Science",
  sub:"Part 1: how new technologies produced evidence for theories and models",
  groups:[
    {name:"X-ray diffraction & DNA", words:["Rosalind Franklin","Photo 51","Diffraction pattern","Double helix"],
     why:"X-rays scattered by crystallised DNA produced Photo 51. Its X-shaped pattern was evidence for Watson and Crick's double helix model."},
    {name:"Detecting radioactivity", words:["Geiger–Müller counter","Cloud chamber","Film badge","Photographic plate"],
     why:"Becquerel's fogged photographic plates revealed radioactivity. Cloud chambers show particle tracks, film badges darken with exposure, and G–M counters count ionising events."},
    {name:"Rutherford's gold foil experiment", words:["Alpha particles","Gold foil","Fluorescent screen","Nucleus"],
     why:"Alpha particles fired at thin gold foil flashed on a screen. A few bounced back, giving evidence for a tiny, dense, positive nucleus."},
    {name:"Modelling Earth's geological history", words:["Plate tectonics","Mantle flow","Computer simulation","Fault zones"],
     why:"Computer simulations model mantle flow, plate motion and fault zones. This is evidence that supports plate tectonic theory."}
  ],
  herrings:[
    {word:"Photographic plate", tempts:"X-ray diffraction & DNA", why:"Photo 51 was a photograph, but the photographic plate here is Becquerel's: uranium fogged it, revealing radioactivity."},
    {word:"Nucleus", tempts:"X-ray diffraction & DNA", why:"DNA is found in the cell nucleus, but this is the atomic nucleus revealed by the gold foil experiment."},
    {word:"Fluorescent screen", tempts:"Detecting radioactivity", why:"It does detect particles, but it's the screen that surrounded the gold foil and flashed when hit by alpha particles."},
    {word:"Alpha particles", tempts:"Detecting radioactivity", why:"Alpha tracks show up in cloud chambers, but alpha particles were the 'bullets' fired at the gold foil."}
  ]
},
{
  title:"Round 4 · Science → Technology",
  sub:"Part 2: how theories and laws drove the development of new technologies",
  groups:[
    {name:"Laws of reflection & refraction", words:["Snell's law","Reflecting telescope","Compound microscope","Endoscope"],
     why:"Refraction (Snell's law) led to lenses in microscopes, reflection to mirrors in telescopes, and total internal reflection to the optical fibres in endoscopes."},
    {name:"Radioactivity & decay", words:["Gamma rays","Radiotherapy","Half-life","Little Boy"],
     why:"Radioactive decay knowledge led to radiotherapy (gamma beams kill cancer cells), the use of half-life in choosing isotopes, and nuclear bombs such as Little Boy."},
    {name:"DNA structure → biotechnology", words:["Plasmid","Restriction enzyme","Bt cotton","Insulin-making bacteria"],
     why:"Restriction enzymes cut genes out, and plasmids carry them into another organism (recombinant DNA). This gives transgenic organisms such as Bt cotton and insulin-producing bacteria."},
    {name:"Newton's laws → earthquake-proofing", words:["Inertia","Base isolation","Tuned mass damper","Cross-bracing"],
     why:"Newton's first law: on base isolators the building's inertia keeps it still while the ground moves. Dampers and bracing absorb and resist forces."}
  ],
  herrings:[
    {word:"Gamma rays", tempts:"Laws of reflection & refraction", why:"They're electromagnetic waves like light, but they come from radioactive decay and are used in radiotherapy."},
    {word:"Endoscope", tempts:"Radioactivity & decay (medical technology)", why:"It's a medical device, but it works by total internal reflection in optical fibres. That's optics, not radiation."},
    {word:"Insulin-making bacteria", tempts:"Radioactivity & decay (medical technology)", why:"Medical again, but insulin comes from genetically modified bacteria, so it's a DNA technology."},
    {word:"Compound microscope", tempts:"DNA structure → biotechnology", why:"It's a lab tool used in biology, but it was developed from the laws of refraction (lenses)."}
  ]
},
{
  title:"Round 5 · People, places & Country",
  sub:"LHC, the Australian context and key scientists",
  groups:[
    {name:"Large Hadron Collider", words:["CERN","Higgs boson","Protons","International collaboration"],
     why:"The Standard Model predicted the Higgs boson, and finding it needed CERN's LHC, which smashes protons together. It was built and run by scientists from many countries."},
    {name:"Aboriginal & Torres Strait Islander knowledge", words:["Bush medicine","Emu bush","Cultural & intellectual property","Community partnership"],
     why:"Emu bush has been used for sores and colds. This knowledge is Indigenous cultural and intellectual property, so ethical drug development needs partnership with communities on Country."},
    {name:"The DNA story", words:["Franklin","Wilkins","Watson","Crick"],
     why:"Franklin and Wilkins produced the X-ray diffraction evidence, and Watson and Crick built the double helix model (1953)."},
    {name:"Building atomic theory", words:["Becquerel","Marie Curie","Rutherford","Geiger"],
     why:"Becquerel discovered radioactivity and the Curies investigated it. Geiger did the gold foil experiment under Rutherford, who proposed the nuclear model."}
  ],
  herrings:[
    {word:"Higgs boson", tempts:"A group of scientists", why:"It's named after Peter Higgs, but it's a particle: the one the LHC was built to find."},
    {word:"Protons", tempts:"Building atomic theory", why:"A subatomic particle, but here they're what the LHC accelerates and collides."},
    {word:"Geiger", tempts:"Large Hadron Collider (particle detectors)", why:"Particle detection is his famous link, but Geiger was Rutherford's assistant in the gold foil experiment."},
    {word:"International collaboration", tempts:"Aboriginal & Torres Strait Islander knowledge (partnership)", why:"It's about working together, but this is the many countries behind CERN and the LHC."}
  ]
},
{
  tab:"Bonus 1",
  title:"Bonus 1 · Staffroom or science?",
  sub:"Is it a teacher, a scientist or a unit?",
  groups:[
    {name:"Our teachers", words:["Lay","Frew","Rogers","Mai"],
     why:"Teachers at our school. Hopefully you didn't put any of them in the atomic theory group!"},
    {name:"The DNA story", words:["Franklin","Wilkins","Watson","Crick"],
     why:"Franklin and Wilkins produced the X-ray diffraction evidence, and Watson and Crick built the double helix model (1953)."},
    {name:"Building atomic theory", words:["Becquerel","Curie","Rutherford","Geiger"],
     why:"Becquerel discovered radioactivity and the Curies investigated it. Geiger did the gold foil experiment under Rutherford."},
    {name:"Units named after scientists", words:["Kelvin","Pascal","Volt","Joule"],
     why:"Kelvin (temperature, for Charles' law), pascal (pressure, for Boyle's law), volt (voltage) and joule (energy)."}
  ],
  herrings:[
    {word:"Becquerel", tempts:"Units named after scientists", why:"The becquerel (Bq) is the unit of radioactivity, but here it's Henri Becquerel, who discovered radioactivity with photographic plates."},
    {word:"Curie", tempts:"Units named after scientists", why:"The curie is an old unit of radioactivity, but here it's Marie Curie, who helped build atomic theory."},
    {word:"Kelvin", tempts:"Our teachers", why:"It sounds like someone's name (it was Lord Kelvin's title), but here it's the SI unit of temperature."},
    {word:"Crick", tempts:"Our teachers", why:"Could be a staff member, but it's Francis Crick of Watson and Crick."}
  ]
},
{
  tab:"Bonus 2",
  title:"Bonus 2 · Who's in the staffroom?",
  sub:"Teachers, laws, particles and light",
  groups:[
    {name:"Our teachers", words:["Downes","Sant","Lam","Huang"],
     why:"Teachers at our school."},
    {name:"Scientists with laws named after them", words:["Boyle","Charles","Snell","Newton"],
     why:"Boyle's law and Charles' law (gases), Snell's law (refraction) and Newton's laws (motion and earthquake-proofing)."},
    {name:"Particles", words:["Proton","Neutron","Electron","Higgs"],
     why:"Subatomic particles. The Higgs boson was found at the LHC in 2012."},
    {name:"Optical technology", words:["Telescope","Microscope","Optical fibre","Endoscope"],
     why:"Technologies developed from the laws of reflection and refraction."}
  ],
  herrings:[
    {word:"Charles", tempts:"Our teachers", why:"Looks like someone's first name, but it's Jacques Charles of Charles' law (V ∝ T)."},
    {word:"Higgs", tempts:"Our teachers", why:"Sounds like a surname (Peter Higgs), but on its own here it's the Higgs boson particle."},
    {word:"Newton", tempts:"Our teachers", why:"A person's name, but Isaac Newton's first law is behind base isolation in earthquake-proof buildings."},
    {word:"Electron", tempts:"Optical technology", why:"Think electron microscope? Those use electron beams, not light. Here it's a particle."}
  ]
},
{
  tab:"Bonus 3",
  title:"Bonus 3 · Staffroom shuffle",
  sub:"Teachers, nicknames, pracs and plant medicines",
  groups:[
    {name:"Our teachers", words:["Koulouris","Alexander-Enobakhare","Choudary","Bhagchandani"],
     why:"Teachers at our school. Bonus points if you can spell them all!"},
    {name:"Nicknames & code names", words:["Little Boy","Photo 51","God particle","Plum pudding"],
     why:"Little Boy (the Hiroshima bomb), Photo 51 (Franklin's DNA image), the 'God particle' (the media's name for the Higgs boson) and the plum pudding model (Thomson's atom)."},
    {name:"Practical investigations", words:["Alka-Seltzer","Model lung","Magnesium ribbon","Data logger"],
     why:"Equipment and materials from the Module 6 practical investigations in the slides."},
    {name:"Medicines from plants", words:["Emu bush","Willow bark","Aspirin","Bush medicine"],
     why:"Emu bush is an Aboriginal bush medicine. Aspirin was developed from salicylic acid in willow bark."}
  ],
  herrings:[
    {word:"Plum pudding", tempts:"Medicines from plants", why:"It sounds like food made from plants, but it's the nickname for Thomson's model of the atom."},
    {word:"Aspirin", tempts:"Practical investigations", why:"Alka-Seltzer contains aspirin, but aspirin itself belongs with the plant medicines (from willow bark)."},
    {word:"Alka-Seltzer", tempts:"Medicines from plants", why:"It's a medicine, but here it's the tablet used in the temperature on reaction rate prac."},
    {word:"Little Boy", tempts:"Our teachers", why:"Sounds like a person, but it's the code name of the atomic bomb dropped on Hiroshima."}
  ]
}
];

const COLORS=["var(--g0)","var(--g1)","var(--g2)","var(--g3)"];
const MAX_MISTAKES=4;
let r=0, state=[];
const $=id=>document.getElementById(id);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function newState(i){
  const R=ROUNDS[i];
  const tiles=R.groups.flatMap(g=>g.words);
  return {tiles:shuffle(tiles),selected:[],solved:[],mistakes:0,over:false,won:false,guesses:[]};
}
ROUNDS.forEach((_,i)=>state[i]=newState(i));

function groupOf(word){const R=ROUNDS[r];return R.groups.findIndex(g=>g.words.includes(word))}

function renderTabs(){
  $("rounds").innerHTML="";
  ROUNDS.forEach((R,i)=>{
    const b=document.createElement("button");
    b.textContent=R.tab||("Round "+(i+1));
    if(i===r)b.classList.add("active");
    if(state[i].over)b.classList.add("done");
    b.onclick=()=>{r=i;render();};
    $("rounds").appendChild(b);
  });
}

function isHerring(w){return ROUNDS[r].herrings.some(h=>h.word===w)}
function solvedHTML(gi,full){
  const g=ROUNDS[r].groups[gi];
  return `<div class="solved" style="background:${COLORS[gi]}"><h3>${g.name}</h3><div class="words">${g.words.map(w=>isHerring(w)?w+" 🐟":w).join(", ")}</div><div class="why">${g.why}</div></div>`;
}

function render(){
  const S=state[r], R=ROUNDS[r];
  renderTabs();
  let html=S.solved.map(gi=>solvedHTML(gi)).join("");
  if(S.over){
    R.groups.forEach((g,gi)=>{if(!S.solved.includes(gi))html+=solvedHTML(gi)});
    html+=`<div class="herrings"><h3>🐟 The red herrings</h3><ul>${R.herrings.map(h=>`<li><b>${h.word}</b> (looked like <i>${h.tempts}</i>): ${h.why}</li>`).join("")}</ul></div>`;
  }
  $("solvedArea").innerHTML=html;
  const grid=$("grid"); grid.innerHTML="";
  if(!S.over){
    S.tiles.filter(t=>!S.solved.some(gi=>R.groups[gi].words.includes(t))).forEach(t=>{
      const b=document.createElement("button");
      b.className="tile"+(S.selected.includes(t)?" sel":"");
      b.textContent=t; b.dataset.w=t;
      b.onclick=()=>toggle(t);
      grid.appendChild(b);
    });
  }
  $("lives").innerHTML=Array.from({length:MAX_MISTAKES},(_,i)=>`<span class="dot ${i<S.mistakes?'lost':''}"></span>`).join("");
  $("submitBtn").disabled=S.over||S.selected.length!==4;
  $("clearBtn").disabled=S.over||!S.selected.length;
  $("shuffleBtn").disabled=S.over;
  $("nextBtn").style.display=(S.over&&r<ROUNDS.length-1)?"":"none";
  if(S.over && !$("status").dataset.keep){
    $("status").textContent=S.won?(S.mistakes===0?"Perfect! No mistakes 🎉":"Solved! 🎉"):"Out of mistakes. Here are the answers.";
  }
}

function toggle(t){
  const S=state[r]; if(S.over)return;
  $("status").textContent="";
  const i=S.selected.indexOf(t);
  if(i>=0)S.selected.splice(i,1); else if(S.selected.length<4)S.selected.push(t);
  render();
}

function submit(){
  const S=state[r], R=ROUNDS[r];
  if(S.selected.length!==4)return;
  const key=[...S.selected].sort().join("|");
  if(S.guesses.includes(key)){$("status").textContent="Already guessed!";return;}
  S.guesses.push(key);
  const counts={};
  S.selected.forEach(w=>{const g=groupOf(w);counts[g]=(counts[g]||0)+1});
  const hit=Object.entries(counts).find(([g,c])=>g!=="-1"&&c===4);
  if(hit){
    S.solved.push(+hit[0]); S.selected=[];
    $("status").textContent="Correct! ✔";
    if(S.solved.length===4){S.over=true;S.won=true;}
    render();
    if(S.over)$("status").textContent=S.mistakes===0?"Perfect! No mistakes 🎉 Now check the red herrings below.":"Solved! 🎉 Now check the red herrings below.";
    return;
  }
  S.mistakes++;
  let msg="Not a group.";
  if(Object.entries(counts).some(([g,c])=>g!=="-1"&&c===3))msg="One away…";
  document.querySelectorAll(".tile.sel").forEach(el=>{el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")});
  if(S.mistakes>=MAX_MISTAKES){S.over=true;S.selected=[];render();$("status").textContent="Out of mistakes. Here are the answers and the red herrings.";return;}
  setTimeout(()=>{render();$("status").textContent=msg;},350);
  $("status").textContent=msg;
}

$("submitBtn").onclick=submit;
$("clearBtn").onclick=()=>{state[r].selected=[];render()};
$("shuffleBtn").onclick=()=>{shuffle(state[r].tiles);render()};
$("resetBtn").onclick=()=>{state[r]=newState(r);$("status").textContent="";render()};
$("nextBtn").onclick=()=>{r++;$("status").textContent="";render();window.scrollTo({top:0,behavior:"smooth"})};

function setTheme(t){
  document.documentElement.dataset.theme=t;
  $("themeBtn").textContent=t==="dark"?"☀️":"🌙";
  try{localStorage.setItem("m6-theme",t)}catch(e){}
}
let saved=null; try{saved=localStorage.getItem("m6-theme")}catch(e){}
setTheme(saved||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"));
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

render();
</script>
</body>
</html>
