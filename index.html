<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investigating Science Module 6: technologies Games</title>
<style>
:root{
  --bg:#f6f4ef; --ink:#1d1d1f; --muted:#6b6b70; --tile:#e7e3d8; --tile-sel:#4a4a52;
  --card:#fff; --btn:#fff; --line:#ddd; --dotlost:#ccc;
  --g0:#f2d65c; --g1:#9fc77a; --g2:#9cc0ea; --g3:#bf9fdc; --herring:#ef7f6c;
}
html[data-theme="dark"]{--bg:#16171b;--ink:#ecebe6;--muted:#a0a0a8;--tile:#2c2d34;--tile-sel:#d9d7cf;--card:#202127;--btn:#202127;--line:#34353c;--dotlost:#44454c;
  --g0:#e3c64a;--g1:#8fb86b;--g2:#87aedb;--g3:#ad8ccc;--herring:#e06f5d}
html[data-theme="dark"] .tile.sel{color:#16171b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
#themeBtn{border:2px solid var(--ink);background:var(--btn);color:var(--ink);border-radius:999px;padding:5px 10px;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;white-space:nowrap;margin-top:4px}
header h1{font-size:clamp(22px,4vw,32px);margin:4px 0 2px;font-weight:800;letter-spacing:-.5px}
header p{margin:0;color:var(--muted);font-size:15px}
.rounds{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 8px}
.rounds button{border:2px solid var(--ink);color:var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer}
.rounds button.active{background:var(--ink);color:var(--bg)}
.rounds button.done::after{content:" ✓"}
.round-title{margin:10px 0 2px;font-size:19px;font-weight:800}
.round-sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.info{font-size:14px;margin-bottom:12px;color:var(--muted)}
.info b{color:var(--herring)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;background:var(--tile);border:none;border-radius:8px;min-height:80px;padding:6px;font:700 clamp(11px,1.9vw,15px) -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-transform:uppercase;cursor:pointer;line-height:1.15;color:var(--ink);transition:transform .1s, background .15s}
.tile:hover{transform:translateY(-1px)}
.tile.sel{background:var(--tile-sel);color:#fff}
.tile.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.solved{color:#1d1d1f;border-radius:8px;padding:12px 10px;text-align:center;margin-bottom:8px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.solved h3{margin:0 0 3px;font-size:15px;text-transform:uppercase;font-weight:800}
.solved .words{font-size:14px;font-weight:600}
.solved .why{font-size:13px;margin-top:6px;font-weight:400;opacity:.9}
.herrings{color:#1d1d1f;background:var(--herring);border-radius:8px;padding:12px;margin-bottom:8px}
.herrings h3{margin:0 0 6px;text-align:center;text-transform:uppercase;font-size:15px}
.herrings ul{margin:0;padding-left:18px;font-size:13.5px}
.herrings li{margin:4px 0}
.hint{text-align:center;font-size:14px;margin:0 0 12px;color:var(--ink)}
.hint span{display:inline-block;background:var(--tile);border-radius:999px;padding:4px 12px;margin:3px;font-weight:600}
.status{min-height:26px;text-align:center;font-weight:700;margin:12px 0 4px}
.lives{text-align:center;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--tile-sel);margin:0 3px;vertical-align:middle}
.dot.lost{background:var(--dotlost)}
.controls{display:flex;justify-content:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.controls button{border:2px solid var(--ink);color:var(--ink);background:var(--btn);border-radius:999px;padding:9px 18px;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer}
.controls button.primary{background:var(--ink);color:var(--bg)}
.controls button:disabled{opacity:.35;cursor:default}
.score{text-align:center;margin-top:14px;font-size:14px;color:var(--muted)}
details{margin-top:36px;background:var(--card);border-radius:10px;padding:12px 16px;border:1px solid var(--line)}
summary{font-weight:700;cursor:pointer}
.key h4{margin:16px 0 6px}
.key table{width:100%;border-collapse:collapse;font-size:13px}
.key td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.key td:first-child{font-weight:700;width:34%}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.howto{font-size:14px;line-height:1.5}
@media (max-width:520px){.tile{min-height:62px;font-size:10px;padding:4px}}

/* ---------- hub ---------- */
[hidden]{display:none!important}
.topbar{display:flex;align-items:center;gap:10px;margin:-8px 0 18px;min-height:34px}
#backBtn{border:2px solid var(--ink);background:var(--btn);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer}
#gameName{font-size:20px;font-weight:800}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.menu button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px 16px;text-align:left;cursor:pointer;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;transition:transform .1s,border-color .1s}
.menu button:hover{transform:translateY(-2px);border-color:var(--ink)}
.menu .ic{font-size:30px;display:block;margin-bottom:8px}
.menu b{display:block;font-size:17px;margin-bottom:4px}
.menu span.d{font-size:13px;color:var(--muted);line-height:1.35}
/* ---------- crossword ---------- */
.xw-clue{min-height:44px;background:var(--tile);border-radius:8px;padding:10px 12px;font-size:15px;margin-bottom:12px}
.xw-grid{display:grid;gap:0;margin:0 auto;border:2px solid var(--ink);background:var(--ink);width:100%}
.xw-cell{position:relative;aspect-ratio:1;background:var(--card);border:1px solid var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.xw-cell.block{background:var(--bg);border-color:var(--bg);cursor:default}
.xw-cell.word{background:#cfe3f7}
.xw-cell.cur{background:#f7d774}
html[data-theme="dark"] .xw-cell:not(.block){background:#3a3c45}
html[data-theme="dark"] .xw-cell.word{background:#2f4a66}
html[data-theme="dark"] .xw-cell.cur{background:#8a7424}
.xw-cell.wrong .xw-letter{color:#d23b2a}
.xw-cell.revealed .xw-letter{color:#2a62c9}
.xw-cell.right{background:#bfe0a6}
html[data-theme="dark"] .xw-cell.right{background:#3d5a2a}
.xw-num{position:absolute;top:1px;left:3px;font-size:clamp(7px,1.5vw,10px);color:var(--muted);font-weight:600}
.xw-letter{font-weight:700;font-size:clamp(13px,3.6vw,22px);text-transform:uppercase}
.xw-input{position:fixed;left:0;top:40%;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
.xw-clues{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.xw-clues h3{margin:0 0 6px;font-size:15px;text-transform:uppercase}
.xw-clues ol{list-style:none;margin:0;padding:0;font-size:14px}
.xw-clues li{padding:5px 6px;border-radius:6px;cursor:pointer;line-height:1.3}
.xw-clues li.on{background:#cfe3f7}
html[data-theme="dark"] .xw-clues li.on{background:#2f4a66}
.xw-len{color:var(--muted);font-size:12px}
@media (max-width:520px){.xw-clues{grid-template-columns:1fr}}
/* ---------- wordle ---------- */
.wd-board{display:grid;gap:6px;justify-content:center;margin:6px 0 4px}
.wd-board{--n:5;--sz:min(60px,calc((min(100vw,640px) - 32px - (var(--n) - 1)*6px)/var(--n)))}
.wd-row{display:grid;grid-template-columns:repeat(var(--n),var(--sz));gap:6px}
.wd-len{text-align:center;color:var(--muted);font-size:14px;margin-bottom:6px}
.wd-tile{aspect-ratio:1;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--sz)*.5);text-transform:uppercase}
.wd-tile.filled{border-color:var(--muted)}
.correct{background:#6aaa64!important;border-color:#6aaa64!important;color:#fff!important}
.present{background:#c9b458!important;border-color:#c9b458!important;color:#fff!important}
.absent{background:#787c7e!important;border-color:#787c7e!important;color:#fff!important}
.wd-keys{margin-top:8px}
.wd-krow{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
.wd-key{flex:1;max-width:44px;height:52px;border:none;border-radius:6px;background:var(--tile);color:var(--ink);font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;padding:0}
.wd-key.wide{max-width:66px;font-size:12px;flex:1.5}
.wd-clue{text-align:center;font-size:15px;min-height:22px;margin:6px 0}
/* ---------- hangman ---------- */
.hm-svg{display:block;margin:0 auto;width:200px;max-width:60%}
.hm-svg line,.hm-svg circle{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round}
.hm-word{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px 0 8px}
.hm-l{width:clamp(20px,6vw,30px);border-bottom:3px solid var(--ink);text-align:center;font-weight:800;font-size:clamp(18px,5vw,26px);height:clamp(28px,7vw,36px)}
.hm-gap{width:16px}
.hm-sym{font-weight:800;font-size:24px}
.hm-keys{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;max-width:460px;margin:12px auto 0}
.hm-key{max-width:none;height:44px}
.hm-key:disabled{cursor:default}
/* ---------- 10 hints ---------- */
.th-score{text-align:right;font-size:14px;color:var(--muted);margin-bottom:8px}
.th-list{list-style:none;margin:0;padding:0}
.th-list li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:15px;line-height:1.35}
.th-list li.hidden-hint{color:var(--muted);background:transparent;border-style:dashed}
.th-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hidden-hint .th-n{background:var(--dotlost)}
.th-row{display:flex;gap:8px;margin-top:14px}
.th-row input{flex:1;min-width:0;font-size:16px;padding:10px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.th-row button{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 18px;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer}
.th-row button:disabled{opacity:.35}
.th-answer{text-align:center;font-size:18px;font-weight:800;min-height:24px}

/* ---------- word search ---------- */
.ws-wrap{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:16px;align-items:start}
.ws-grid{display:grid;gap:3px;user-select:none}
.ws-cell{aspect-ratio:1;border:none;border-radius:6px;background:var(--tile);color:var(--ink);font:700 clamp(13px,3.6vw,19px) -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;padding:0}
.ws-cell.found{background:#9fc77a;color:#1d1d1f}
.ws-cell.start{background:#f2d65c;color:#1d1d1f;outline:2px solid var(--ink)}
.ws-list{list-style:none;margin:0;padding:0;font-size:14px}
.ws-list li{padding:5px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);margin-bottom:5px;font-weight:600}
.ws-list li.done{text-decoration:line-through;opacity:.5}
.ws-count{font-size:13px;color:var(--muted);margin-bottom:6px}
@media (max-width:560px){.ws-wrap{grid-template-columns:1fr}.ws-list{display:flex;flex-wrap:wrap;gap:5px}.ws-list li{margin:0}}
/* ---------- scramble ---------- */
.sc-score,.sq-score{text-align:right;font-size:14px;color:var(--muted);margin-bottom:10px}
.sc-letters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 14px}
.sc-tile{width:clamp(34px,9vw,46px);height:clamp(34px,9vw,46px);border-radius:8px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(18px,5vw,24px)}
.sc-clue{text-align:center;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.sc-help{text-align:center;color:var(--muted);min-height:20px;margin-top:8px;font-weight:600}
/* ---------- memory ---------- */
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mm-card{min-height:96px;border:none;border-radius:10px;background:var(--tile-sel);color:var(--bg);cursor:pointer;padding:6px;font:600 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.25;transition:transform .15s}
.mm-card span{display:block}
.mm-card:not(.up) span{font-size:26px;font-weight:800;opacity:.6}
.mm-card.up{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.mm-card.up.term{font-size:14px;font-weight:800;text-transform:uppercase}
.mm-card.matched{background:#bfe0a6;color:#1d1d1f;border-color:#9fc77a}
@media (max-width:520px){.mm-grid{grid-template-columns:repeat(3,1fr)}.mm-card{min-height:90px;font-size:11px}.mm-card.up.term{font-size:12px}}
/* ---------- speed quiz ---------- */
.sq-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sq-time{font-size:22px;font-weight:800}
.sq-time.low{color:#d23b2a}
.sq-clue{text-align:center;font-size:18px;font-weight:600;min-height:64px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sq-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sq-opt{border:none;border-radius:10px;background:var(--tile);color:var(--ink);padding:16px 8px;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer}
.sq-final{text-align:center;font-size:22px;font-weight:800;margin:14px 0}
.sq-rev{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.sq-rev ul{margin:6px 0 0;padding-left:18px}
/* ---------- sort it ---------- */
.so-q{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.so-card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:26px 18px;text-align:center;font-size:19px;font-weight:700;min-height:110px;display:flex;align-items:center;justify-content:center}
.so-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.so-btns button{border:none;border-radius:12px;padding:16px 10px;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;color:#1d1d1f;line-height:1.3}
.so-btns small{display:block;font-weight:500;font-size:12px;margin-top:3px}
#soTS{background:var(--g2)} #soST{background:var(--g0)}
.so-feedback{text-align:center;min-height:44px;margin-top:12px;font-size:15px}
.so-feedback.good{color:#3f8a37} .so-feedback.bad{color:#d23b2a}
html[data-theme="dark"] .so-feedback.good{color:#8fd07f} html[data-theme="dark"] .so-feedback.bad{color:#ff8a7a}
.so-progress{text-align:right;font-size:14px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Investigating Science Module 6: technologies</h1>
  <button id="themeBtn" aria-label="Toggle light and dark mode"></button>
</header>
<div class="topbar" id="topbar" hidden><button id="backBtn" hidden>← Games</button><div id="gameName"></div></div>

<section id="menu" class="screen">
  <div class="menu">
    <button data-game="connect"><span class="ic">🧩</span><b>Connection</b><span class="d">Sort 16 tiles into 4 groups. Watch out for red herrings!</span></button>
    <button data-game="xword"><span class="ic">✏️</span><b>Mini Crossword</b><span class="d">A new mini crossword of Module 6 terms every time.</span></button>
    <button data-game="wordle"><span class="ic">🟩</span><b>Wordle</b><span class="d">Guess the science word in 6 tries. Words are 4 to 10 letters long.</span></button>
    <button data-game="hang"><span class="ic">🔤</span><b>Hangman</b><span class="d">Guess the key term one letter at a time.</span></button>
    <button data-game="hints"><span class="ic">🔍</span><b>10 Hints</b><span class="d">Name the mystery term in as few hints as you can.</span></button>
    <button data-game="search"><span class="ic">🔎</span><b>Word Search</b><span class="d">Find 8 hidden terms. Try hard mode with clues only!</span></button>
    <button data-game="scramble"><span class="ic">🔀</span><b>Word Scramble</b><span class="d">Unscramble the key term from its clue. Build a streak!</span></button>
    <button data-game="memory"><span class="ic">🃏</span><b>Memory Match</b><span class="d">Flip cards to match each term with its clue.</span></button>
    <button data-game="speed"><span class="ic">⏱️</span><b>Speed Quiz</b><span class="d">How many can you get right in 60 seconds?</span></button>
    <button data-game="sort"><span class="ic">↔️</span><b>Sort It</b><span class="d">Did technology drive the science, or did the science drive the technology?</span></button>
  </div>
</section>

<section id="screen-connect" class="screen" hidden>
<div id="solvedArea"></div>
<div class="hint" id="hint"></div>
<div class="grid" id="grid"></div>
<div class="status" id="status"></div>
<div class="lives" id="lives"></div>
<div class="controls">
  <button id="shuffleBtn">Shuffle</button>
  <button id="clearBtn">Deselect</button>
  <button id="hintBtn">💡 Hint</button>
  <button id="submitBtn" class="primary">Submit</button>
  <button id="newBtn">New game</button>
</div>



</section>

<section id="screen-xword" class="screen" hidden>
  <div class="xw-clue" id="xwClue"></div>
  <div class="xw-grid" id="xwGrid"></div>
  <input id="xwInput" class="xw-input" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Crossword letter">
  <div class="status" id="xwStatus"></div>
  <div class="controls">
    <button id="xwCheck">Check</button>
    <button id="xwRevealWord">Reveal word</button>
    <button id="xwRevealAll">Reveal all</button>
    <button id="xwNew" class="primary">New crossword</button>
  </div>
  <div class="xw-clues"><div><h3>Across</h3><ol id="xwAcross"></ol></div><div><h3>Down</h3><ol id="xwDown"></ol></div></div>
</section>

<section id="screen-wordle" class="screen" hidden>
  <div class="wd-len" id="wdLen"></div>
  <div class="wd-board" id="wdBoard"></div>
  <div class="status" id="wdStatus"></div>
  <div class="wd-clue" id="wdClue"></div>
  <div class="wd-keys" id="wdKeys"></div>
  <div class="controls">
    <button id="wdHintBtn">💡 Hint</button>
    <button id="wdNew" class="primary">New word</button>
  </div>
</section>

<section id="screen-hang" class="screen" hidden>
  <svg class="hm-svg" viewBox="0 0 200 220" aria-hidden="true">
    <line x1="20" y1="210" x2="140" y2="210"/><line x1="50" y1="210" x2="50" y2="20"/><line x1="50" y1="20" x2="130" y2="20"/><line x1="130" y1="20" x2="130" y2="45"/>
    <circle class="hm-part" cx="130" cy="65" r="20"/>
    <line class="hm-part" x1="130" y1="85" x2="130" y2="145"/>
    <line class="hm-part" x1="130" y1="100" x2="105" y2="125"/>
    <line class="hm-part" x1="130" y1="100" x2="155" y2="125"/>
    <line class="hm-part" x1="130" y1="145" x2="110" y2="180"/>
    <line class="hm-part" x1="130" y1="145" x2="150" y2="180"/>
  </svg>
  <div class="hm-word" id="hmWord"></div>
  <div class="lives" id="hmLives"></div>
  <div class="wd-clue" id="hmClue"></div>
  <div class="status" id="hmStatus"></div>
  <div class="hm-keys" id="hmKeys"></div>
  <div class="controls">
    <button id="hmHintBtn">💡 Hint</button>
    <button id="hmNew" class="primary">New word</button>

// Red herrings: a tile that belongs to its own group but looks like it fits a group with one of these tags
const HERRINGS = {
  "Hydrochloric acid":{tempts:["safety"],why:"It's a hazard, but here it's a reactant in the rate prac. (The Safety Data Sheet is the safety technology.)"},
  "Kelvin scale":{tempts:["rate-prac","analogue"],why:"It's about temperature, but kelvin is needed for Charles' law calculations (°C + 273)."},

  "Limewater":{tempts:["gas"],why:"It's about gases, but limewater tests for carbon dioxide. It doesn't measure volume."},
  "Squeaky pop":{tempts:["rate-prac"],why:"Mg + HCl does make hydrogen, but the squeaky pop is the test for hydrogen gas."},

  "Poor calibration":{tempts:["digital","analogue"],why:"Any device can be badly calibrated, but poor calibration is the classic cause of systematic error."},
  "Accuracy":{tempts:["systematic"],why:"Systematic errors affect accuracy, but accuracy itself describes data quality."},
  "Precision":{tempts:["random","digital"],why:"Random error affects precision, and digital readings show it, but precision describes data quality."},
  "Record the full reading":{tempts:["quality","random"],why:"It sounds like a data-quality rule, but it's specifically about digital displays (1.32 s, not 1.3 s)."},
  "Photographic plate":{tempts:["dna-xray"],why:"Photo 51 was a photograph, but photographic plates fogged by uranium revealed radioactivity."},
  "Nucleus":{tempts:["dna-xray","biotech"],why:"DNA is found in the cell nucleus, but this is the atomic nucleus found by the gold foil experiment."},

  "Higgs boson":{tempts:["scientists","teachers"],why:"It's named after a person (Peter Higgs), but it's the particle found at CERN."},
  "Gamma rays":{tempts:["optics"],why:"They're electromagnetic waves like light, but they come from radioactive decay and are used in radiotherapy."},
  "Optic fibres":{tempts:["dialysis","radiotech"],why:"They're used in medicine, but they were developed from the law of reflection."},
  "Microscope":{tempts:["biotech","dna-xray"],why:"It's a biology tool, but microscopes were developed from the law of refraction."},

};
const HERRING_WHY={}, TEMPTS={};
Object.entries(HERRINGS).forEach(([w,h])=>{HERRING_WHY[w]=h.why;TEMPTS[w]=h.tempts;});
POOL.forEach((g,i)=>g.id=String(i));

const owner={}; POOL.forEach((g,i)=>g.words.forEach(w=>(owner[w]=owner[w]||[]).push(i)));
function clash(a,b){const A=POOL[a],B=POOL[b];return A.tags.some(t=>B.tags.includes(t))||A.words.some(w=>B.words.includes(w))}
function activeHerrings(ids){
  const out=[];
  ids.forEach(i=>POOL[i].words.forEach(w=>{
    const tempts=TEMPTS[w]; if(!tempts)return;
    const lure=ids.filter(j=>j!==i&&POOL[j].tags.some(t=>tempts.includes(t)));
    if(lure.length)out.push({word:w,lure:lure.map(j=>POOL[j].name),why:HERRING_WHY[w]});
  }));
  return out;
}
// Every valid board of 4 groups, scored by how many red herrings are live on it
const BOARDS=[];
for(let a=0;a<POOL.length;a++)for(let b=a+1;b<POOL.length;b++){if(clash(a,b))continue;
 for(let c=b+1;c<POOL.length;c++){if(clash(a,c)||clash(b,c))continue;
  for(let d=c+1;d<POOL.length;d++){if(clash(a,d)||clash(b,d)||clash(c,d))continue;
   const ids=[a,b,c,d]; BOARDS.push({ids,score:activeHerrings(ids).length});}}}
const GOOD=BOARDS.filter(x=>x.score>=4).length>=50?BOARDS.filter(x=>x.score>=4):BOARDS.filter(x=>x.score>=3);

const COLORS=["var(--g0)","var(--g1)","var(--g2)","var(--g3)"];
const MAX_MISTAKES=4;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let S=null, lastIds=[];
function newGame(){
  // Pick a random group first so every group gets a fair turn, then a board built around it
  let pick, tries=0;
  do{
    const anchor=Math.floor(Math.random()*POOL.length);
    const options=GOOD.filter(b=>b.ids.includes(anchor));
    pick=options[Math.floor(Math.random()*options.length)];
    tries++;
  }while(tries<50 && (!pick || pick.ids.filter(i=>lastIds.includes(i)).length>1));
  lastIds=pick.ids;
  const ids=shuffle([...pick.ids]);
  S={ids,herrings:activeHerrings(ids),tiles:shuffle(ids.flatMap(i=>POOL[i].words)),
     selected:[],solved:[],hints:[],mistakes:0,over:false,won:false,guesses:[]};
  $("status").textContent="";
  render();
}
function groupOf(w){return S.ids.findIndex(i=>POOL[i].words.includes(w))}
function isHerring(w){return S.herrings.some(h=>h.word===w)}
function solvedHTML(k){
  const g=POOL[S.ids[k]];
  return `<div class="solved" style="background:${COLORS[k]}"><h3>${g.name}</h3><div class="words">${g.words.map(w=>isHerring(w)?w+" 🐟":w).join(", ")}</div><div class="why">${g.why}</div></div>`;
}
function render(){
  let html=S.solved.map(k=>solvedHTML(k)).join("");
  if(S.over){
    S.ids.forEach((_,k)=>{if(!S.solved.includes(k))html+=solvedHTML(k)});
    html+=`<div class="herrings"><h3>🐟 The red herrings</h3><ul>${S.herrings.map(h=>`<li><b>${h.word}</b> (looked like <i>${h.lure.join(" / ")}</i>): ${h.why}</li>`).join("")}</ul></div>`;
  }
  $("solvedArea").innerHTML=html;
  const shown=S.hints.filter(k=>!S.solved.includes(k));
  $("hint").innerHTML=(!S.over&&shown.length)?"💡 Find: "+shown.map(k=>`<span>${POOL[S.ids[k]].name}</span>`).join(""):"";
  $("hint").style.display=(!S.over&&shown.length)?"":"none";
  const grid=$("grid"); grid.innerHTML="";
  if(!S.over){
    S.tiles.filter(t=>!S.solved.includes(groupOf(t))).forEach(t=>{
      const b=document.createElement("button");
      b.className="tile"+(S.selected.includes(t)?" sel":"");
      b.textContent=t; b.dataset.w=t; b.onclick=()=>toggle(t);
      grid.appendChild(b);
    });
  }
  $("lives").innerHTML=Array.from({length:MAX_MISTAKES},(_,i)=>`<span class="dot ${i<S.mistakes?'lost':''}"></span>`).join("");
  $("submitBtn").disabled=S.over||S.selected.length!==4;
  $("clearBtn").disabled=S.over||!S.selected.length;
  $("shuffleBtn").disabled=S.over;
  $("hintBtn").disabled=S.over||S.ids.every((_,k)=>S.solved.includes(k)||S.hints.includes(k));
}
function toggle(t){
  if(S.over)return;
  $("status").textContent="";
  const i=S.selected.indexOf(t);
  if(i>=0)S.selected.splice(i,1); else if(S.selected.length<4)S.selected.push(t);
  render();
}
function submit(){
  if(S.selected.length!==4)return;
  const key=[...S.selected].sort().join("|");
  if(S.guesses.includes(key)){$("status").textContent="Already guessed!";return;}
  S.guesses.push(key);
  const counts={}; S.selected.forEach(w=>{const g=groupOf(w);counts[g]=(counts[g]||0)+1});
  const hit=Object.entries(counts).find(([g,c])=>c===4);
  if(hit){
    S.solved.push(+hit[0]); S.selected=[];
    if(S.solved.length===4){S.over=true;S.won=true;}
    render();
    $("status").textContent=S.over?(S.mistakes===0?"Perfect! No mistakes 🎉":"Solved! 🎉"):"Correct! ✔";
    return;
  }
  S.mistakes++;
  const msg=Object.values(counts).some(c=>c===3)?"One away…":"Not a group.";
  document.querySelectorAll(".tile.sel").forEach(el=>{el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")});
  if(S.mistakes>=MAX_MISTAKES){S.over=true;S.selected=[];render();$("status").textContent="Out of mistakes. Here are the answers.";return;}
  render(); $("status").textContent=msg;
}
$("submitBtn").onclick=submit;
$("hintBtn").onclick=()=>{
  const left=S.ids.map((_,k)=>k).filter(k=>!S.solved.includes(k)&&!S.hints.includes(k));
  if(!left.length)return;
  S.hints.push(left[Math.floor(Math.random()*left.length)]);
  $("status").textContent="";
  render();
};
$("clearBtn").onclick=()=>{S.selected=[];render()};
$("shuffleBtn").onclick=()=>{shuffle(S.tiles);render()};
$("newBtn").onclick=()=>{newGame();window.scrollTo({top:0,behavior:"smooth"})};

  document.documentElement.dataset.theme=t;
  $("themeBtn").textContent=t==="dark"?"☀️":"🌙";
  try{localStorage.setItem("m6-theme",t)}catch(e){}
}

$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

newGame();

const XW = {grid:null};
function xwBuild(){
  const pool = shuf(BANK.filter(b=>{const L=letters(b.show).length;return L>=4&&L<=7}).map(b=>({w:letters(b.show),clue:b.clue,show:b.show})));
  let best=null;
  for(let attempt=0;attempt<80;attempt++){
    const words=shuf([...pool]).slice(0,14);
    const placed=[]; const cells={};
    const key=(r,c)=>r+","+c;
    const get=(r,c)=>cells[key(r,c)];
    function fits(w,r,c,dir){
      const dr=dir==="D"?1:0, dc=dir==="A"?1:0; let cross=0;
      if(get(r-dr,c-dc)||get(r+dr*w.length,c+dc*w.length))return -1;
      for(let i=0;i<w.length;i++){
        const rr=r+dr*i, cc=c+dc*i, ch=get(rr,cc);
        if(ch){ if(ch!==w[i])return -1; cross++; }
        else { if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return -1; }
      }
      return cross;
    }
    function put(o){const dr=o.dir==="D"?1:0,dc=o.dir==="A"?1:0;for(let i=0;i<o.w.length;i++)cells[key(o.r+dr*i,o.c+dc*i)]=o.w[i];placed.push(o);}
    put({...words[0],r:0,c:0,dir:"A"});
    for(const wd of words.slice(1)){
      if(placed.length>=6)break;
      const opts=[];
      for(const p of placed)for(let i=0;i<p.w.length;i++)for(let j=0;j<wd.w.length;j++){
        if(p.w[i]!==wd.w[j])continue;
        const dir=p.dir==="A"?"D":"A";
        const r=p.dir==="A"?p.r-j:p.r+i, c=p.dir==="A"?p.c+i:p.c-j;
        const x=fits(wd.w,r,c,dir); if(x>0)opts.push({...wd,r,c,dir,x});
      }
      if(!opts.length)continue;
      const tmp=Object.keys(cells).map(k=>k.split(",").map(Number));
      opts.forEach(o=>{ // prefer compact layouts
        const rs=tmp.map(t=>t[0]).concat([o.r,o.r+(o.dir==="D"?o.w.length-1:0)]);
        const cs=tmp.map(t=>t[1]).concat([o.c,o.c+(o.dir==="A"?o.w.length-1:0)]);
        o.area=(Math.max(...rs)-Math.min(...rs)+1)*(Math.max(...cs)-Math.min(...cs)+1)-o.x*6+Math.random()*4;
      });
      opts.sort((a,b)=>a.area-b.area); put(opts[0]);
    }
    const ks=Object.keys(cells).map(k=>k.split(",").map(Number));
    const H=Math.max(...ks.map(k=>k[0]))-Math.min(...ks.map(k=>k[0]))+1;
    const W=Math.max(...ks.map(k=>k[1]))-Math.min(...ks.map(k=>k[1]))+1;
    const score=placed.length*100-H*W-Math.abs(H-W)*8;
    if(placed.length>=5&&W<=8&&H<=8&&(!best||score>best.score))best={placed,cells,score,H,W,minR:Math.min(...ks.map(k=>k[0])),minC:Math.min(...ks.map(k=>k[1]))};
  }
  return best;
}
function xwNew(){
  const b=xwBuild(); if(!b)return xwNew();
  const H=b.H,W=b.W, sol=Array.from({length:H},()=>Array(W).fill(null));
  b.placed.forEach(p=>{p.r-=b.minR;p.c-=b.minC;});
  b.placed.forEach(p=>{for(let i=0;i<p.w.length;i++){const r=p.r+(p.dir==="D"?i:0),c=p.c+(p.dir==="A"?i:0);sol[r][c]=p.w[i];}});
  // number starts in reading order
  const starts={}; let n=0;
  b.placed.slice().sort((a,b)=>a.r-b.r||a.c-b.c).forEach(p=>{const k=p.r+","+p.c;if(!starts[k])starts[k]=++n;p.num=starts[k];});
  Object.assign(XW,{grid:sol,H,W,words:b.placed,starts,dir:"A",cur:null,entry:Array.from({length:H},()=>Array(W).fill("")),done:false,checked:false});
  xwRender(); el("xwStatus").textContent="";
  const first=b.placed.find(p=>p.num===1); xwSelect(first.r,first.c,first.dir);
}
function xwWordAt(r,c,dir){return XW.words.find(p=>p.dir===dir&&(dir==="A"?p.r===r&&c>=p.c&&c<p.c+p.w.length:p.c===c&&r>=p.r&&r<p.r+p.w.length))}
function xwRender(){
  const g=el("xwGrid"); g.innerHTML=""; g.style.gridTemplateColumns=`repeat(${XW.W},1fr)`;

    if(!XW.grid[r][c]){d.className="xw-cell block";g.appendChild(d);continue;}

    d.onclick=()=>{ if(XW.cur&&XW.cur[0]===r&&XW.cur[1]===c){const other=XW.dir==="A"?"D":"A";if(xwWordAt(r,c,other))XW.dir=other;} xwSelect(r,c,XW.dir); };
    g.appendChild(d);
  }
  const list=dir=>XW.words.filter(p=>p.dir===dir).sort((a,b)=>a.num-b.num).map(p=>`<li data-k="${p.num}${dir}"><b>${p.num}</b> ${p.clue} <span class="xw-len">(${p.show.split(/[ -]/).map(x=>x.length).join(p.show.includes("-")?"-":",")})</span></li>`).join("");
  el("xwAcross").innerHTML=list("A"); el("xwDown").innerHTML=list("D");
  document.querySelectorAll("#xwAcross li,#xwDown li").forEach(li=>li.onclick=()=>{const p=XW.words.find(w=>w.num+w.dir===li.dataset.k);xwSelect(p.r,p.c,p.dir);});
}
function xwSelect(r,c,dir){
  if(!xwWordAt(r,c,dir))dir=dir==="A"?"D":"A";

    if(rr===r&&cc===c)d.classList.add("cur");
  });
  document.querySelectorAll("#xwAcross li,#xwDown li").forEach(li=>li.classList.toggle("on",w&&li.dataset.k===w.num+w.dir));
  el("xwClue").innerHTML=w?`<b>${w.num} ${w.dir==="A"?"Across":"Down"}</b> ${w.clue}`:"";
  const inp=el("xwInput"); inp.value=""; try{inp.focus({preventScroll:true})}catch(e){}
}
function xwCell(r,c){return document.querySelector(`.xw-cell[data-r="${r}"][data-c="${c}"]`)}
function xwType(ch){
  if(!XW.cur||XW.done)return; const [r,c]=XW.cur;
  XW.entry[r][c]=ch; const cell=xwCell(r,c); cell.querySelector(".xw-letter").textContent=ch; cell.classList.remove("wrong");
  const nr=r+(XW.dir==="D"?1:0), nc=c+(XW.dir==="A"?1:0);
  if(XW.grid[nr]&&XW.grid[nr][nc])xwSelect(nr,nc,XW.dir);
  xwCheckWin();
}
function xwBack(){
  if(!XW.cur||XW.done)return; let [r,c]=XW.cur;
  if(!XW.entry[r][c]){const pr=r-(XW.dir==="D"?1:0),pc=c-(XW.dir==="A"?1:0); if(XW.grid[pr]&&XW.grid[pr][pc]){r=pr;c=pc;xwSelect(r,c,XW.dir);}}
  XW.entry[r][c]=""; xwCell(r,c).querySelector(".xw-letter").textContent=""; xwCell(r,c).classList.remove("wrong");
}
function xwMove(dr,dc){
  if(!XW.cur)return; let [r,c]=XW.cur;
  for(let i=0;i<12;i++){r+=dr;c+=dc; if(r<0||c<0||r>=XW.H||c>=XW.W)return; if(XW.grid[r][c]){xwSelect(r,c,dr?"D":"A");return;}}
}
function xwCheckWin(){
  const ok=XW.grid.every((row,r)=>row.every((ch,c)=>!ch||XW.entry[r][c]===ch));
  if(ok){XW.done=true; el("xwStatus").textContent="Solved! 🎉"; document.querySelectorAll(".xw-cell:not(.block)").forEach(d=>d.classList.add("right"));}
}
el("xwInput").addEventListener("input",e=>{const v=(e.target.value||"").toUpperCase().replace(/[^A-Z]/g,""); e.target.value=""; if(v)xwType(v.slice(-1));});

function wdScore(guess,ans){
  const n=ans.length, res=Array(n).fill("absent"), left={};
  for(let i=0;i<n;i++){if(guess[i]===ans[i])res[i]="correct";else left[ans[i]]=(left[ans[i]]||0)+1;}
  for(let i=0;i<n;i++){if(res[i]!=="correct"&&left[guess[i]]){res[i]="present";left[guess[i]]--;}}
  return res;
}

    const rank={absent:0,present:1,correct:2};
    [...WD.cur].forEach((ch,i)=>{if(!WD.keys[ch]||rank[s[i]]>rank[WD.keys[ch]])WD.keys[ch]=s[i];});
    if(WD.cur===WD.answer){WD.done=true;el("wdStatus").textContent=["Genius!","Magnificent!","Impressive!","Splendid!","Great!","Phew!"][WD.rows.length-1]+" 🎉";el("wdClue").textContent=WD.clue;}

const TH={item:null, total:0, played:0, order:[]};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function thNew(){
  if(!TH.order.length)TH.order=shuf(TEN.map((_,i)=>i));
  TH.item=TEN[TH.order.pop()]; TH.shown=1; TH.done=false; TH.tries=[];
  el("thGuess").value=""; el("thGuess").disabled=false; el("thStatus").textContent=""; el("thAnswer").textContent="";
  thRender();
}
function thRender(){
  el("thList").innerHTML=TH.item.hints.map((h,i)=>`<li class="${i<TH.shown?"":"hidden-hint"}"><span class="th-n">${i+1}</span>${i<TH.shown?h:"?"}</li>`).join("");
  el("thPoints").textContent=TH.done?"":`Worth ${11-TH.shown} point${11-TH.shown===1?"":"s"} if you get it now`;
  el("thMore").disabled=TH.done||TH.shown>=10; el("thSubmit").disabled=TH.done; el("thGive").disabled=TH.done;
  el("thScore").textContent=`Score: ${TH.total}  ·  Played: ${TH.played}`;
}
function thEnd(win){
  TH.done=true; TH.played++; if(win)TH.total+=11-TH.shown;
  TH.shown=10; el("thGuess").disabled=true;
  el("thAnswer").textContent=(win?"✔ ":"")+"Answer: "+TH.item.answer;
  thRender();
}
function thCheck(){
  if(TH.done)return; const g=norm(el("thGuess").value); if(!g)return;
  const ok=TH.item.accept.some(a=>{const n=norm(a);return n===g||(n.length>5&&lev(n,g)<=1);});
  if(ok){el("thStatus").textContent=`Correct! +${11-TH.shown} points 🎉`;thEnd(true);}
  else{
    el("thStatus").textContent=`"${el("thGuess").value}" isn't it.`+(TH.shown<10?" Here's another hint.":"");
    el("thGuess").value="";
    if(TH.shown<10)TH.shown++; else {el("thStatus").textContent="Out of hints!";thEnd(false);return;}
    thRender();
  }
}
el("thSubmit").onclick=thCheck;
el("thGuess").addEventListener("keydown",e=>{if(e.key==="Enter")thCheck();});
el("thMore").onclick=()=>{if(TH.shown<10){TH.shown++;el("thStatus").textContent="";thRender();}};
el("thGive").onclick=()=>{el("thStatus").textContent="No worries, here's the answer.";thEnd(false);};

// Two terms clash if one contains the other (e.g. HELIX / DOUBLE HELIX), so they never appear as rival answers
const clashTerms=(a,b)=>{const x=letters(a.show),y=letters(b.show);return x.includes(y)||y.includes(x);};
// ================= Word Search =================
const WS={};
function wsNew(){
  const N=10, dirs=[[0,1],[1,0],[1,1],[-1,1],[0,-1],[1,-1]];
  for(let attempt=0;attempt<50;attempt++){
    const pool=shuf(BANK.filter(b=>/^[A-Z]+$/.test(b.show)&&b.show.length>=4&&b.show.length<=9));
    const g=Array.from({length:N},()=>Array(N).fill("")), placed=[];
    for(const b of pool){
      if(placed.length>=8)break;
      const w=b.show; let ok=false;
      for(let t=0;t<120&&!ok;t++){
        const [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)];
        const r=Math.floor(Math.random()*N), c=Math.floor(Math.random()*N);
        const er=r+dr*(w.length-1), ec=c+dc*(w.length-1);
        if(er<0||er>=N||ec<0||ec>=N)continue;
        let fits=true;
        for(let i=0;i<w.length;i++){const ch=g[r+dr*i][c+dc*i];if(ch&&ch!==w[i]){fits=false;break;}}
        if(!fits)continue;
        for(let i=0;i<w.length;i++)g[r+dr*i][c+dc*i]=w[i];
        placed.push({w,clue:b.clue,r,c,dr,dc,found:false}); ok=true;
      }
    }
    if(placed.length<8)continue;
    const A="ABCDEFGHIJKLMNOPRSTUVWY";
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])g[r][c]=A[Math.floor(Math.random()*A.length)];
    Object.assign(WS,{N,g,words:placed.sort((a,b)=>a.w.localeCompare(b.w)),start:null,found:new Set(),showClues:false});
    el("wsStatus").textContent="Tap the first letter of a word, then its last letter.";
    wsRender(); return;
  }
}
function wsRender(){
  const grid=el("wsGrid"); grid.innerHTML=""; grid.style.gridTemplateColumns=`repeat(${WS.N},1fr)`;
  const foundCells=new Set();
  WS.words.filter(w=>w.found).forEach(w=>{for(let i=0;i<w.w.length;i++)foundCells.add((w.r+w.dr*i)+","+(w.c+w.dc*i));});
  for(let r=0;r<WS.N;r++)for(let c=0;c<WS.N;c++){
    const d=document.createElement("button"); d.className="ws-cell"; d.textContent=WS.g[r][c];
    if(foundCells.has(r+","+c))d.classList.add("found");
    if(WS.start&&WS.start[0]===r&&WS.start[1]===c)d.classList.add("start");
    d.onclick=()=>wsTap(r,c); grid.appendChild(d);
  }
  el("wsList").innerHTML=WS.words.map(w=>`<li class="${w.found?"done":""}">${WS.showClues&&!w.found?w.clue:w.w}</li>`).join("");
  el("wsCount").textContent=`${WS.words.filter(w=>w.found).length} / ${WS.words.length} found`;
}
function wsTap(r,c){
  if(!WS.start){WS.start=[r,c];wsRender();return;}
  const [r0,c0]=WS.start; WS.start=null;
  const hit=WS.words.find(w=>!w.found&&((w.r===r0&&w.c===c0&&w.r+w.dr*(w.w.length-1)===r&&w.c+w.dc*(w.w.length-1)===c)||(w.r===r&&w.c===c&&w.r+w.dr*(w.w.length-1)===r0&&w.c+w.dc*(w.w.length-1)===c0)));
  if(hit){hit.found=true; const all=WS.words.every(w=>w.found);
    el("wsStatus").textContent=all?"All words found! 🎉":`Found ${hit.w}! ✔`;}
  else if(!(r===r0&&c===c0)) el("wsStatus").textContent="Not a word. Try again.";
  wsRender();
}
el("wsClues").onclick=()=>{WS.showClues=!WS.showClues;el("wsClues").textContent=WS.showClues?"Show words":"Hard mode: show clues";wsRender();};
el("wsNew").onclick=()=>{WS.showClues=false;el("wsClues").textContent="Hard mode: show clues";wsNew();};

// ================= Word Scramble =================
const SC={score:0,streak:0,best:0};
function scNew(){
  const pool=BANK.filter(b=>/^[A-Z]+$/.test(b.show)&&b.show.length>=5&&b.show.length<=10);
  let p; do{p=pool[Math.floor(Math.random()*pool.length)];}while(p.show===SC.word&&pool.length>1);
  let mixed; do{mixed=shuf([...p.show]).join("");}while(mixed===p.show);
  Object.assign(SC,{word:p.show,clue:p.clue,mixed,done:false,hinted:0});
  el("scLetters").innerHTML=[...mixed].map(ch=>`<span class="sc-tile">${ch}</span>`).join("");
  el("scClue").textContent=p.clue; el("scGuess").value=""; el("scGuess").disabled=false;
  el("scStatus").textContent=""; el("scHelp").textContent=""; scScore();
}
function scScore(){el("scScore").textContent=`Score: ${SC.score}  ·  Streak: ${SC.streak}  ·  Best streak: ${SC.best}`;}
function scCheck(){
  if(SC.done)return; const g=el("scGuess").value.toUpperCase().replace(/[^A-Z]/g,""); if(!g)return;
  if(g===SC.word){SC.done=true;SC.score+=Math.max(1,3-SC.hinted);SC.streak++;SC.best=Math.max(SC.best,SC.streak);
    el("scStatus").textContent="Correct! 🎉"; el("scLetters").innerHTML=[...SC.word].map(ch=>`<span class="sc-tile correct">${ch}</span>`).join(""); el("scGuess").disabled=true; scScore();
    setTimeout(()=>{if(SC.done&&activeGame==="scramble")scNew();},1400);}
  else{el("scStatus").textContent="Not quite. Keep trying!";SC.streak=0;scScore();}
}
el("scSubmit").onclick=scCheck;
el("scGuess").addEventListener("keydown",e=>{if(e.key==="Enter")scCheck();});
el("scShuffle").onclick=()=>{if(SC.done)return;SC.mixed=shuf([...SC.mixed]).join("");el("scLetters").innerHTML=[...SC.mixed].map(ch=>`<span class="sc-tile">${ch}</span>`).join("");};
el("scHint").onclick=()=>{if(SC.done)return;SC.hinted=Math.min(SC.hinted+1,SC.word.length-1);el("scHelp").textContent="Starts with: "+SC.word.slice(0,SC.hinted);};
el("scSkip").onclick=()=>{if(!SC.done){SC.streak=0;el("scStatus").textContent="It was "+SC.word;SC.done=true;el("scGuess").disabled=true;scScore();setTimeout(()=>{if(activeGame==="scramble")scNew();},1600);}};

// ================= Memory Match =================
const MM={};
function mmNew(){
  const picks=[]; for(const b of shuf(BANK.filter(b=>b.clue.length<=62))){if(picks.length<6&&!picks.some(p=>clashTerms(p,b)))picks.push(b);}
  const cards=shuf(picks.flatMap((b,i)=>[{pair:i,text:b.show,kind:"term"},{pair:i,text:b.clue,kind:"clue"}]));
  Object.assign(MM,{cards,open:[],matched:new Set(),moves:0,lock:false});
  el("mmStatus").textContent="Match each term with its clue."; mmRender();
}
function mmRender(){
  const g=el("mmGrid"); g.innerHTML="";
  MM.cards.forEach((c,i)=>{
    const b=document.createElement("button");
    const up=MM.open.includes(i)||MM.matched.has(c.pair);
    b.className="mm-card"+(up?" up "+c.kind:"")+(MM.matched.has(c.pair)?" matched":"");
    b.innerHTML=up?`<span>${c.text}</span>`:"<span>?</span>";
    b.onclick=()=>mmFlip(i); g.appendChild(b);
  });
  el("mmMoves").textContent=`Moves: ${MM.moves}  ·  Pairs: ${MM.matched.size} / 6`;
}
function mmFlip(i){
  if(MM.lock||MM.open.includes(i)||MM.matched.has(MM.cards[i].pair))return;
  MM.open.push(i); mmRender();
  if(MM.open.length===2){
    MM.moves++; const [a,b]=MM.open;
    if(MM.cards[a].pair===MM.cards[b].pair){MM.matched.add(MM.cards[a].pair);MM.open=[];mmRender();
      if(MM.matched.size===6)el("mmStatus").textContent=`All matched in ${MM.moves} moves! 🎉`;}
    else{MM.lock=true;mmRender();setTimeout(()=>{MM.open=[];MM.lock=false;mmRender();},1100);}
  }
}
el("mmNew").onclick=mmNew;

// ================= Speed Quiz =================
const SQ={best:0,running:false};
try{SQ.best=+localStorage.getItem("m6-sq-best")||0}catch(e){}
function sqStart(){
  clearInterval(SQ.timer);
  Object.assign(SQ,{score:0,left:60,running:true,asked:0,wrong:[]});
  el("sqStart").textContent="Restart"; el("sqEnd").innerHTML=""; sqQ(); sqTick();
  SQ.timer=setInterval(()=>{SQ.left--;sqTick();if(SQ.left<=0)sqStop();},1000);
}
function sqTick(){el("sqTime").textContent=`⏱ ${SQ.left}s`;el("sqTime").classList.toggle("low",SQ.left<=10);el("sqScore").textContent=`Score: ${SQ.score}  ·  Best: ${SQ.best}`;}
function sqQ(){
  const ans=BANK[Math.floor(Math.random()*BANK.length)];
  const others=[]; for(const b of shuf(BANK.filter(b=>b!==ans&&!clashTerms(b,ans)))){if(others.length<3&&!others.some(o=>clashTerms(o,b)))others.push(b);}
  const opts=shuf([ans,...others]);
  SQ.cur=ans; el("sqClue").textContent=ans.clue;
  el("sqOpts").innerHTML="";
  opts.forEach(o=>{const b=document.createElement("button");b.className="sq-opt";b.textContent=o.show;
    b.onclick=()=>{ if(!SQ.running)return;
      if(o===ans){SQ.score++;b.classList.add("correct");} else {b.classList.add("absent");SQ.wrong.push(ans);SQ.left=Math.max(0,SQ.left-3);
        [...el("sqOpts").children].forEach(x=>{if(x.textContent===ans.show)x.classList.add("correct")});}
      SQ.running=false; sqTick(); setTimeout(()=>{if(SQ.left>0){SQ.running=true;sqQ();}},o===ans?250:700);
    };
    el("sqOpts").appendChild(b);});
}
function sqStop(){
  clearInterval(SQ.timer); SQ.timer=null; SQ.running=false; SQ.left=0;
  if(SQ.score>SQ.best){SQ.best=SQ.score;try{localStorage.setItem("m6-sq-best",SQ.best)}catch(e){}}
  sqTick(); el("sqClue").textContent=""; el("sqOpts").innerHTML="";
  const rev=[...new Map(SQ.wrong.map(w=>[w.show,w])).values()];
  el("sqEnd").innerHTML=`<div class="sq-final">Time's up! You scored ${SQ.score} 🎉</div>`+(rev.length?`<div class="sq-rev"><b>Revise these:</b><ul>${rev.map(w=>`<li><b>${w.show}</b>: ${w.clue}</li>`).join("")}</ul></div>`:"");
  el("sqStart").textContent="Play again";
}
el("sqStart").onclick=sqStart;

function soShow(){

function soAnswer(a){

el("soTS").onclick=()=>soAnswer("TS");
el("soST").onclick=()=>soAnswer("ST");
el("soNew").onclick=soNew;
